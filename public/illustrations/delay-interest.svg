<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="How delay interest is calculated under MahaRERA and what filing a complaint involves">
  <rect width="1200" height="675" fill="#fef4e9"/>
  <rect x="0" y="0" width="1200" height="6" fill="#405828"/>

  <text x="80" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#2b2a29">If possession is late, interest is arithmetic</text>
  <text x="80" y="130" font-family="Helvetica Neue, Arial, sans-serif" font-size="19" fill="#4a4640">You do not have to win an argument to be owed it. You have to have a registered agreement and a missed date.</text>

  <!-- The formula -->
  <rect x="80" y="176" width="1040" height="150" rx="14" fill="#26361a"/>
  <g font-family="Helvetica Neue, Arial, sans-serif">
    <text x="120" y="216" font-size="13" fill="#a37731" letter-spacing="0.18em">THE RATE</text>
    <text x="120" y="264" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#fffaf4">SBI MCLR + 2%</text>
    <text x="120" y="298" font-size="16" fill="#fffaf4" opacity="0.6">on every rupee you have paid</text>

    <text x="560" y="264" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#a37731">=</text>

    <text x="640" y="216" font-size="13" fill="#a37731" letter-spacing="0.18em">AS AT APRIL 2026</text>
    <text x="640" y="264" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#fffaf4">10.85% a year</text>
    <text x="640" y="298" font-size="16" fill="#fffaf4" opacity="0.6">running from the agreed date to actual possession</text>
  </g>

  <!-- Process -->
  <text x="80" y="386" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#73695d" letter-spacing="0.18em">IF YOU HAVE TO FILE</text>

  <g font-family="Helvetica Neue, Arial, sans-serif">
    <rect x="80" y="406" width="246" height="132" rx="12" fill="#fffaf4" stroke="#d9c29c"/>
    <text x="108" y="452" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#405828">₹5,000</text>
    <text x="108" y="484" font-size="16" fill="#4a4640">complaint fee,</text>
    <text x="108" y="506" font-size="16" fill="#4a4640">paid online</text>

    <rect x="344" y="406" width="246" height="132" rx="12" fill="#fffaf4" stroke="#d9c29c"/>
    <text x="372" y="452" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#405828">60 to 90</text>
    <text x="372" y="484" font-size="16" fill="#4a4640">days to a first</text>
    <text x="372" y="506" font-size="16" fill="#4a4640">hearing, typically</text>

    <rect x="608" y="406" width="246" height="132" rx="12" fill="#fffaf4" stroke="#d9c29c"/>
    <text x="636" y="452" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#405828">60 days</text>
    <text x="636" y="484" font-size="16" fill="#4a4640">to pay, once the</text>
    <text x="636" y="506" font-size="16" fill="#4a4640">order is made</text>

    <rect x="872" y="406" width="248" height="132" rx="12" fill="#26361a"/>
    <text x="900" y="446" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#fffaf4">Enforceable</text>
    <text x="900" y="478" font-size="16" fill="#fffaf4" opacity="0.7">Recoverable as arrears</text>
    <text x="900" y="500" font-size="16" fill="#fffaf4" opacity="0.7">of land revenue, through</text>
    <text x="900" y="522" font-size="16" fill="#fffaf4" opacity="0.7">the District Collector</text>
  </g>

  <line x1="80" y1="576" x2="1120" y2="576" stroke="#d9c29c" stroke-width="1.5"/>
  <text x="80" y="614" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#405828">The date that counts is the one on the MahaRERA record</text>
  <text x="80" y="646" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" fill="#4a4640">Not the one in the brochure, and not the one you were told in the lounge. Check the declared completion date for your phase before you book.</text>
  <text x="80" y="668" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#73695d">General information, not legal advice. Rates change; confirm the current one before relying on it.</text>
</svg>
