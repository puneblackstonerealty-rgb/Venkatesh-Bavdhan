<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Timeline of the five-year structural defect liability period under RERA section 14(3)">
  <rect width="1200" height="675" fill="#fef4e9"/>
  <rect x="0" y="0" width="1200" height="6" fill="#405828"/>

  <text x="80" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#2b2a29">Five years of warranty you already own</text>
  <text x="80" y="130" font-family="Helvetica Neue, Arial, sans-serif" font-size="19" fill="#4a4640">Section 14(3) of the Real Estate (Regulation and Development) Act, 2016</text>

  <!-- Timeline -->
  <rect x="120" y="212" width="1000" height="52" rx="8" fill="#405828"/>
  <circle cx="120" cy="238" r="16" fill="#a37731"/>
  <g font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#fffaf4" text-anchor="middle">
    <text x="220" y="245">year 1</text>
    <text x="420" y="245">year 2</text>
    <text x="620" y="245">year 3</text>
    <text x="820" y="245">year 4</text>
    <text x="1020" y="245">year 5</text>
  </g>
  <text x="120" y="196" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#8a6224" text-anchor="middle">possession</text>
  <text x="1120" y="196" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#73695d" text-anchor="end">cover ends</text>

  <!-- The 30 day rule -->
  <rect x="80" y="308" width="500" height="152" rx="14" fill="#26361a"/>
  <text x="108" y="348" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#a37731" letter-spacing="0.18em">ONCE YOU REPORT IT IN WRITING</text>
  <text x="108" y="396" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#fffaf4">30 days</text>
  <text x="108" y="430" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" fill="#fffaf4" opacity="0.65">for the promoter to put it right,</text>
  <text x="108" y="452" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" fill="#fffaf4" opacity="0.65">at no cost to you.</text>

  <rect x="620" y="308" width="500" height="152" rx="14" fill="#fffaf4" stroke="#d9c29c"/>
  <text x="648" y="348" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#73695d" letter-spacing="0.18em">WHAT IS COVERED</text>
  <text x="648" y="382" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#4a4640">Structural defects</text>
  <text x="648" y="410" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#4a4640">Defective workmanship</text>
  <text x="648" y="438" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#4a4640">Poor quality of materials or services</text>

  <line x1="80" y1="504" x2="1120" y2="504" stroke="#d9c29c" stroke-width="1.5"/>
  <text x="80" y="546" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#405828">A one-year warranty clause in your agreement does not shorten this</text>
  <text x="80" y="580" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#4a4640">The statutory period overrides a private contract term. If the agreement offers less, the Act still gives you five years.</text>
  <text x="80" y="616" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#4a4640">Report every defect in writing, dated, with photographs. A verbal complaint starts no clock and proves nothing later.</text>

  <text x="80" y="660" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#73695d">General information about the statute, not legal advice. The period runs from the date of possession, per unit.</text>
</svg>
