<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Schematic of the planned Chandani Chowk to Bhugaon road widening, with the flyover tender cancelled in September 2026">
  <rect width="1200" height="675" fill="#fef4e9"/>
  <rect x="0" y="0" width="1200" height="6" fill="#405828"/>
  <text x="80" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#2b2a29">Chandani Chowk to Bhugaon</text>
  <text x="80" y="130" font-family="Helvetica Neue, Arial, sans-serif" font-size="19" fill="#4a4640">PMC&#8217;s plan, March 2026: from as narrow as 10 metres to 60 metres, about &#8377;200 crore.</text>

  <g font-family="Helvetica Neue, Arial, sans-serif">
    <!-- Road today vs planned -->
    <text x="80" y="200" font-size="13" fill="#73695d" letter-spacing="0.18em">TODAY · AS NARROW AS 10 M</text>
    <rect x="80" y="214" width="1040" height="22" rx="4" fill="#73695d"/>
    <text x="80" y="290" font-size="13" fill="#73695d" letter-spacing="0.18em">PLANNED · 60 M</text>
    <rect x="80" y="304" width="1040" height="110" rx="8" fill="#d9c29c" opacity="0.55"/>
    <rect x="80" y="352" width="1040" height="14" fill="#73695d"/>

    <!-- Structures -->
    <rect x="220" y="320" width="300" height="78" rx="10" fill="#405828"/>
    <text x="370" y="352" font-size="17" fill="#fffaf4" text-anchor="middle">Flyover, 870 m</text>
    <text x="370" y="376" font-size="14" fill="#fffaf4" text-anchor="middle" opacity="0.75">Ambrosia &amp; Patil Nagar, ~&#8377;82 cr</text>
    <rect x="580" y="320" width="230" height="78" rx="10" fill="#405828"/>
    <text x="695" y="352" font-size="17" fill="#fffaf4" text-anchor="middle">Grade separator</text>
    <text x="695" y="376" font-size="14" fill="#fffaf4" text-anchor="middle" opacity="0.75">430 m, PVG chowk, ~&#8377;27 cr</text>
    <rect x="870" y="320" width="210" height="78" rx="10" fill="#26361a"/>
    <text x="975" y="352" font-size="17" fill="#fffaf4" text-anchor="middle">Ram river bridge</text>
    <text x="975" y="376" font-size="14" fill="#fffaf4" text-anchor="middle" opacity="0.75">30 m long, 70 m wide</text>

    <text x="80" y="450" font-size="15" fill="#73695d">Chandani Chowk</text>
    <text x="1120" y="450" font-size="15" fill="#73695d" text-anchor="end">towards Bhugaon</text>

    <!-- Stamp -->
    <g transform="rotate(-4 600 520)">
      <rect x="370" y="482" width="460" height="74" rx="10" fill="none" stroke="#9a3b2e" stroke-width="3"/>
      <text x="600" y="514" font-size="20" fill="#9a3b2e" text-anchor="middle" letter-spacing="0.08em">FLYOVER TENDER CANCELLED</text>
      <text x="600" y="540" font-size="15" fill="#9a3b2e" text-anchor="middle">September 2026 · to be re-estimated</text>
    </g>
  </g>

  <text x="1120" y="650" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#73695d" text-anchor="end">Schematic, not to scale. Punekar News (Mar 2026), Construction World (Sep 2026).</text>
</svg>
