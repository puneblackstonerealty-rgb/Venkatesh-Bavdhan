<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Ledger of what the developer has released about Serenique and what is still awaited">
  <rect width="1200" height="675" fill="#fef4e9"/>
  <rect x="0" y="0" width="1200" height="6" fill="#405828"/>

  <text x="80" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#2b2a29">Almost everything is out now.</text>
  <text x="80" y="130" font-family="Helvetica Neue, Arial, sans-serif" font-size="19" fill="#4a4640">What the developer has issued about Serenique, as of November 2026</text>

  <!-- Released column -->
  <rect x="80" y="176" width="500" height="440" rx="14" fill="#fffaf4" stroke="#d9c29c"/>
  <rect x="80" y="176" width="500" height="56" rx="14" fill="#405828"/>
  <rect x="80" y="214" width="500" height="18" fill="#405828"/>
  <text x="108" y="212" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#fffaf4" letter-spacing="0.18em">RELEASED</text>

  <g font-family="Helvetica Neue, Arial, sans-serif" font-size="20" fill="#2b2a29">
    <text x="108" y="286">MahaRERA registration</text>
    <text x="556" y="286" fill="#405828" text-anchor="end">Registered</text>
    <line x1="108" y1="308" x2="556" y2="308" stroke="#ebdcc5"/>

    <text x="108" y="348">Configurations</text>
    <text x="556" y="348" fill="#405828" text-anchor="end">1, 2, 2.5 &amp; 3 BHK</text>
    <line x1="108" y1="370" x2="556" y2="370" stroke="#ebdcc5"/>

    <text x="108" y="410">Phase 1</text>
    <text x="556" y="410" fill="#405828" text-anchor="end">1 building</text>
    <line x1="108" y1="432" x2="556" y2="432" stroke="#ebdcc5"/>

    <text x="108" y="472">Floors</text>
    <text x="556" y="472" fill="#405828" text-anchor="end">27 and 28</text>
    <line x1="108" y1="494" x2="556" y2="494" stroke="#ebdcc5"/>

    <text x="108" y="534">Land parcel</text>
    <text x="556" y="534" fill="#405828" text-anchor="end">9.75 acres</text>
  </g>

  <!-- Awaited column -->
  <rect x="620" y="176" width="500" height="440" rx="14" fill="#fffaf4" stroke="#d9c29c" stroke-dasharray="6 5"/>
  <rect x="620" y="176" width="500" height="56" rx="14" fill="#a37731"/>
  <rect x="620" y="214" width="500" height="18" fill="#a37731"/>
  <text x="648" y="212" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#fffaf4" letter-spacing="0.18em">ALSO PUBLISHED</text>

  <g font-family="Helvetica Neue, Arial, sans-serif" font-size="20" fill="#2b2a29">
    <text x="648" y="278">Total homes</text>
    <line x1="648" y1="298" x2="1096" y2="298" stroke="#ebdcc5"/>
    <text x="648" y="332">Carpet areas</text>
    <line x1="648" y1="352" x2="1096" y2="352" stroke="#ebdcc5"/>
    <text x="648" y="386">Price list</text>
    <line x1="648" y1="406" x2="1096" y2="406" stroke="#ebdcc5"/>
    <text x="648" y="440">Floor &amp; master plans</text>
    <line x1="648" y1="460" x2="1096" y2="460" stroke="#ebdcc5"/>
    <text x="648" y="494">Amenity schedule</text>
    <line x1="648" y1="514" x2="1096" y2="514" stroke="#ebdcc5"/>
    <text x="648" y="548">Renders &amp; brochure</text>
  </g>
  <text x="648" y="592" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#8a6224">Every item has a document behind it.</text>

  <text x="80" y="654" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#73695d">Ask the sales team to show you each one. Anything they cannot show you is still a promise.</text>
</svg>
