<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Wing A2 has eight homes a floor, all 2 BHK; Wing A3 has six, including the only 3 BHKs">
  <rect width="1200" height="675" fill="#fef4e9"/>
  <rect x="0" y="0" width="1200" height="6" fill="#405828"/>
  <text x="80" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#2b2a29">Wing A2 or Wing A3</text>
  <text x="80" y="130" font-family="Helvetica Neue, Arial, sans-serif" font-size="19" fill="#4a4640">One building, two very different floors. A typical floor in each wing, from the developer&#8217;s plans.</text>

  <g font-family="Helvetica Neue, Arial, sans-serif">
    <text x="80" y="196" font-size="13" fill="#73695d" letter-spacing="0.18em">WING A2 · 27 FLOORS · 210 UNITS</text>
    <rect x="80" y="214" width="500" height="250" rx="14" fill="#fffaf4" stroke="#d9c29c"/>
    <g fill="#405828">
      <rect x="110" y="244" width="100" height="78" rx="6"/><rect x="220" y="244" width="100" height="78" rx="6"/>
      <rect x="340" y="244" width="100" height="78" rx="6"/><rect x="450" y="244" width="100" height="78" rx="6"/>
      <rect x="110" y="356" width="100" height="78" rx="6"/><rect x="220" y="356" width="100" height="78" rx="6"/>
      <rect x="340" y="356" width="100" height="78" rx="6"/><rect x="450" y="356" width="100" height="78" rx="6"/>
    </g>
    <g font-size="16" fill="#fffaf4" text-anchor="middle">
      <text x="160" y="289">2 BHK</text><text x="270" y="289">2 BHK</text><text x="390" y="289">2 BHK</text><text x="500" y="289">2 BHK</text>
      <text x="160" y="401">2 BHK</text><text x="270" y="401">2 BHK</text><text x="390" y="401">2 BHK</text><text x="500" y="401">2 BHK</text>
    </g>
    <text x="80" y="500" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#2b2a29">8 homes a floor, all 2 BHK</text>
    <text x="80" y="530" font-size="16" fill="#73695d">4 passenger lifts + 1 fire lift</text>

    <text x="640" y="196" font-size="13" fill="#73695d" letter-spacing="0.18em">WING A3 · 28 FLOORS · 167 UNITS</text>
    <rect x="640" y="214" width="480" height="250" rx="14" fill="#fffaf4" stroke="#d9c29c"/>
    <g fill="#405828">
      <rect x="670" y="244" width="130" height="78" rx="6"/><rect x="960" y="244" width="130" height="78" rx="6"/>
      <rect x="670" y="356" width="130" height="78" rx="6"/><rect x="960" y="356" width="130" height="78" rx="6"/>
    </g>
    <g fill="#26361a">
      <rect x="815" y="244" width="130" height="78" rx="6"/><rect x="815" y="356" width="130" height="78" rx="6"/>
    </g>
    <g font-size="16" fill="#fffaf4" text-anchor="middle">
      <text x="735" y="289">2 BHK</text><text x="1025" y="289">2 BHK</text><text x="735" y="401">2 BHK</text><text x="1025" y="401">2 BHK</text>
      <text x="880" y="289">3 BHK</text><text x="880" y="401">3 BHK</text>
    </g>
    <text x="640" y="500" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#2b2a29">6 homes a floor, the only 3 BHKs</text>
    <text x="640" y="530" font-size="16" fill="#73695d">3 passenger lifts + 1 fire lift</text>
  </g>

  <line x1="80" y1="592" x2="1120" y2="592" stroke="#d9c29c" stroke-width="1.5"/>
  <text x="80" y="630" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#405828">Same rate per square metre. Different neighbours, lifts and flat types.</text>
  <text x="80" y="660" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#73695d">Schematic, not to scale. Source: MahaRERA Form C annexure and the developer&#8217;s floor plans, Oct 2026.</text>
</svg>
