<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Schematic of published distances from Bavdhan to nearby landmarks">
  <rect width="1200" height="675" fill="#26361a"/>
  <rect x="0" y="0" width="1200" height="6" fill="#a37731"/>

  <text x="80" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#fffaf4">Distances, not drive times</text>
  <text x="80" y="124" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#fffaf4" opacity="0.6">The developer&#8217;s figures from Serenique. Where a source gave only a distance, only a distance is shown.</text>

  <g fill="none" stroke="#fffaf4" stroke-opacity="0.12" stroke-width="1">
    <circle cx="600" cy="400" r="105"/>
    <circle cx="600" cy="400" r="185"/>
  </g>
  <text x="600" y="308" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#a37731" text-anchor="middle" letter-spacing="0.18em">UNDER 5 KM</text>
  <text x="600" y="228" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#a37731" text-anchor="middle" letter-spacing="0.18em">5 KM AND BEYOND</text>

  <g stroke="#a37731" stroke-opacity="0.45" stroke-width="1.5">
    <line x1="600" y1="400" x2="452" y2="322"/>
    <line x1="600" y1="400" x2="748" y2="322"/>
    <line x1="600" y1="400" x2="390" y2="470"/>
    <line x1="600" y1="400" x2="810" y2="470"/>
    <line x1="600" y1="400" x2="600" y2="600"/>
  </g>

  <circle cx="600" cy="400" r="13" fill="#a37731"/>
  <text x="600" y="440" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#fffaf4" text-anchor="middle">Bavdhan</text>
  <text x="600" y="462" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#fffaf4" opacity="0.5" text-anchor="middle">Survey No. 34, Bavdhan Khurd</text>

  <g font-family="Helvetica Neue, Arial, sans-serif">
    <circle cx="452" cy="322" r="6" fill="#fffaf4"/>
    <text x="452" y="300" font-size="18" fill="#fffaf4" text-anchor="middle">Vanaz Metro</text>
    <text x="452" y="278" font-size="15" fill="#a37731" text-anchor="middle">under 4 km</text>

    <circle cx="748" cy="322" r="6" fill="#fffaf4"/>
    <text x="748" y="300" font-size="18" fill="#fffaf4" text-anchor="middle">Sahyadri Hospital</text>
    <text x="748" y="278" font-size="15" fill="#a37731" text-anchor="middle">about 4 km</text>

    <circle cx="390" cy="470" r="6" fill="#fffaf4"/>
    <text x="390" y="500" font-size="18" fill="#fffaf4" text-anchor="middle">Kothrud &amp; Baner hubs</text>
    <text x="390" y="522" font-size="15" fill="#a37731" text-anchor="middle">2 to 5 km</text>

    <circle cx="810" cy="470" r="6" fill="#fffaf4"/>
    <text x="810" y="500" font-size="18" fill="#fffaf4" text-anchor="middle">Jupiter Hospital, Baner</text>
    <text x="810" y="522" font-size="15" fill="#a37731" text-anchor="middle">about 6 km</text>

    <circle cx="600" cy="600" r="6" fill="#fffaf4"/>
    <text x="600" y="630" font-size="18" fill="#fffaf4" text-anchor="middle">Hinjawadi IT Park</text>
    <text x="600" y="652" font-size="15" fill="#a37731" text-anchor="middle">8 to 12 km</text>
  </g>

  <text x="80" y="668" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#fffaf4" opacity="0.4">Schematic. Not a map, not to scale.</text>
</svg>
