<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Section diagram of a tower showing three basements, ground, podium and twenty-seven floors">
  <rect width="1200" height="675" fill="#f7f5f1"/>
  <rect x="0" y="0" width="1200" height="6" fill="#2c5561"/>

  <text x="80" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#101a20">What 3B + G + P + 27 actually stacks up to</text>
  <text x="80" y="130" font-family="Helvetica Neue, Arial, sans-serif" font-size="19" fill="#47555c">The structure the client confirmed, drawn as a section. Eleven towers of this, on 14 acres.</text>

  <!-- Tower section -->
  <g>
    <!-- 27 residential floors -->
    <rect x="120" y="178" width="200" height="300" fill="#2c5561"/>
    <g stroke="#f7f5f1" stroke-width="1" opacity="0.35">
      <line x1="120" y1="200" x2="320" y2="200"/><line x1="120" y1="222" x2="320" y2="222"/>
      <line x1="120" y1="244" x2="320" y2="244"/><line x1="120" y1="266" x2="320" y2="266"/>
      <line x1="120" y1="288" x2="320" y2="288"/><line x1="120" y1="310" x2="320" y2="310"/>
      <line x1="120" y1="332" x2="320" y2="332"/><line x1="120" y1="354" x2="320" y2="354"/>
      <line x1="120" y1="376" x2="320" y2="376"/><line x1="120" y1="398" x2="320" y2="398"/>
      <line x1="120" y1="420" x2="320" y2="420"/><line x1="120" y1="442" x2="320" y2="442"/>
      <line x1="120" y1="464" x2="320" y2="464"/>
    </g>
    <!-- podium -->
    <rect x="96" y="478" width="248" height="34" fill="#c08654"/>
    <!-- ground -->
    <rect x="110" y="512" width="220" height="26" fill="#8f5f38"/>
    <!-- basements -->
    <rect x="110" y="538" width="220" height="26" fill="#c8d0d1"/>
    <rect x="110" y="564" width="220" height="26" fill="#c8d0d1" opacity="0.8"/>
    <rect x="110" y="590" width="220" height="26" fill="#c8d0d1" opacity="0.6"/>
    <line x1="80" y1="538" x2="1120" y2="538" stroke="#c8d0d1" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="1116" y="532" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#66737a" text-anchor="end">ground level</text>
  </g>

  <!-- Annotations -->
  <g font-family="Helvetica Neue, Arial, sans-serif">
    <line x1="344" y1="328" x2="420" y2="328" stroke="#c8d0d1"/>
    <text x="436" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#101a20">27 residential floors</text>
    <text x="436" y="348" font-size="17" fill="#47555c">Around 90 metres of habitable height. Lifts, water pressure and</text>
    <text x="436" y="370" font-size="17" fill="#47555c">evacuation all become engineering questions at this height.</text>

    <line x1="344" y1="495" x2="420" y2="495" stroke="#c8d0d1"/>
    <text x="436" y="490" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#8f5f38">Podium</text>
    <text x="436" y="516" font-size="17" fill="#47555c">Amenity deck above the cars. Nothing has been published about what</text>
    <text x="436" y="538" font-size="17" fill="#47555c">sits on it.</text>

    <line x1="344" y1="577" x2="420" y2="577" stroke="#c8d0d1"/>
    <text x="436" y="572" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#101a20">Three basements</text>
    <text x="436" y="598" font-size="17" fill="#47555c">Parking below ground rather than between the towers, which is what</text>
    <text x="436" y="620" font-size="17" fill="#47555c">keeps cars off the deck above.</text>
  </g>

  <text x="80" y="662" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#66737a">Structure confirmed by the client on 9 August 2026. Proportions are indicative. No floor plan, elevation or master plan has been published.</text>
</svg>
