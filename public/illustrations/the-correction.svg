<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Comparison of the listing site figures against the figures the client confirmed, showing the scale of the error">
  <rect width="1200" height="675" fill="#f7f5f1"/>
  <rect x="0" y="0" width="1200" height="6" fill="#c08654"/>

  <text x="80" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#101a20">The listing was wrong by 5.6 times</text>
  <text x="80" y="130" font-family="Helvetica Neue, Arial, sans-serif" font-size="19" fill="#47555c">What the only site carrying hard numbers said, against what the developer actually confirmed</text>

  <!-- Land -->
  <text x="80" y="200" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#66737a" letter-spacing="0.18em">LAND PARCEL</text>
  <rect x="80" y="216" width="66" height="44" rx="6" fill="#c8d0d1"/>
  <text x="158" y="246" font-family="Helvetica Neue, Arial, sans-serif" font-size="19" fill="#66737a">2.5 acres, as listed</text>
  <rect x="80" y="272" width="370" height="44" rx="6" fill="#2c5561"/>
  <text x="466" y="302" font-family="Helvetica Neue, Arial, sans-serif" font-size="19" fill="#101a20">14 acres, confirmed</text>
  <text x="1120" y="272" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#c08654" text-anchor="end">5.6×</text>

  <!-- Towers -->
  <text x="80" y="374" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#66737a" letter-spacing="0.18em">TOWERS</text>
  <g fill="#c8d0d1">
    <rect x="80" y="390" width="18" height="44" rx="3"/><rect x="104" y="390" width="18" height="44" rx="3"/><rect x="128" y="390" width="18" height="44" rx="3"/>
  </g>
  <text x="158" y="420" font-family="Helvetica Neue, Arial, sans-serif" font-size="19" fill="#66737a">3 towers, as listed</text>
  <g fill="#2c5561">
    <rect x="80" y="446" width="18" height="44" rx="3"/><rect x="104" y="446" width="18" height="44" rx="3"/><rect x="128" y="446" width="18" height="44" rx="3"/>
    <rect x="152" y="446" width="18" height="44" rx="3"/><rect x="176" y="446" width="18" height="44" rx="3"/><rect x="200" y="446" width="18" height="44" rx="3"/>
    <rect x="224" y="446" width="18" height="44" rx="3"/><rect x="248" y="446" width="18" height="44" rx="3"/><rect x="272" y="446" width="18" height="44" rx="3"/>
    <rect x="296" y="446" width="18" height="44" rx="3"/><rect x="320" y="446" width="18" height="44" rx="3"/>
  </g>
  <text x="358" y="476" font-family="Helvetica Neue, Arial, sans-serif" font-size="19" fill="#101a20">11 towers, confirmed</text>
  <text x="1120" y="446" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#c08654" text-anchor="end">3.7×</text>

  <line x1="80" y1="530" x2="1120" y2="530" stroke="#c8d0d1" stroke-width="1.5"/>

  <!-- The removed figure -->
  <rect x="80" y="556" width="1040" height="94" rx="14" fill="#152430"/>
  <text x="108" y="592" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#c08654" letter-spacing="0.18em">AND ONE FIGURE WE DELETED RATHER THAN CORRECTED</text>
  <text x="108" y="626" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#ffffff">&#8220;380 homes&#8221; came from the same source. No replacement total has been issued.</text>
</svg>
