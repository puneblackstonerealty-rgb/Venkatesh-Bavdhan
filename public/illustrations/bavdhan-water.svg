<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="The questions to ask about water supply before buying in Bavdhan">
  <rect width="1200" height="675" fill="#fef4e9"/>
  <rect x="0" y="0" width="1200" height="6" fill="#a37731"/>

  <text x="80" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#2b2a29">The question nobody volunteers</text>
  <text x="80" y="130" font-family="Helvetica Neue, Arial, sans-serif" font-size="19" fill="#4a4640">Parts of Bavdhan run on an alternate-day municipal supply. Ask about it before you like the flat.</text>

  <!-- Supply comparison -->
  <text x="80" y="196" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#73695d" letter-spacing="0.18em">TWO WEEKS OF SUPPLY, TWO DIFFERENT SOCIETIES</text>

  <g font-family="Helvetica Neue, Arial, sans-serif">
    <text x="80" y="248" font-size="17" fill="#2b2a29">Daily municipal</text>
    <g fill="#405828">
      <rect x="270" y="228" width="52" height="28" rx="4"/><rect x="332" y="228" width="52" height="28" rx="4"/>
      <rect x="394" y="228" width="52" height="28" rx="4"/><rect x="456" y="228" width="52" height="28" rx="4"/>
      <rect x="518" y="228" width="52" height="28" rx="4"/><rect x="580" y="228" width="52" height="28" rx="4"/>
      <rect x="642" y="228" width="52" height="28" rx="4"/><rect x="704" y="228" width="52" height="28" rx="4"/>
      <rect x="766" y="228" width="52" height="28" rx="4"/><rect x="828" y="228" width="52" height="28" rx="4"/>
      <rect x="890" y="228" width="52" height="28" rx="4"/><rect x="952" y="228" width="52" height="28" rx="4"/>
      <rect x="1014" y="228" width="52" height="28" rx="4"/><rect x="1076" y="228" width="44" height="28" rx="4"/>
    </g>

    <text x="80" y="308" font-size="17" fill="#2b2a29">Alternate day</text>
    <g>
      <rect x="270" y="288" width="52" height="28" rx="4" fill="#405828"/><rect x="332" y="288" width="52" height="28" rx="4" fill="#ebdcc5"/>
      <rect x="394" y="288" width="52" height="28" rx="4" fill="#405828"/><rect x="456" y="288" width="52" height="28" rx="4" fill="#ebdcc5"/>
      <rect x="518" y="288" width="52" height="28" rx="4" fill="#405828"/><rect x="580" y="288" width="52" height="28" rx="4" fill="#ebdcc5"/>
      <rect x="642" y="288" width="52" height="28" rx="4" fill="#405828"/><rect x="704" y="288" width="52" height="28" rx="4" fill="#ebdcc5"/>
      <rect x="766" y="288" width="52" height="28" rx="4" fill="#405828"/><rect x="828" y="288" width="52" height="28" rx="4" fill="#ebdcc5"/>
      <rect x="890" y="288" width="52" height="28" rx="4" fill="#405828"/><rect x="952" y="288" width="52" height="28" rx="4" fill="#ebdcc5"/>
      <rect x="1014" y="288" width="52" height="28" rx="4" fill="#405828"/><rect x="1076" y="288" width="44" height="28" rx="4" fill="#ebdcc5"/>
    </g>
    <text x="270" y="348" font-size="15" fill="#73695d">The gap is filled by tankers, and tankers appear on your maintenance bill.</text>
  </g>

  <line x1="80" y1="392" x2="1120" y2="392" stroke="#d9c29c"/>

  <text x="80" y="434" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#2b2a29">Five questions, asked of the society and not the sales team</text>

  <g font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#4a4640">
    <rect x="80" y="462" width="4" height="30" fill="#a37731"/>
    <text x="106" y="484">Municipal or tanker, and how many hours a day?</text>

    <rect x="80" y="502" width="4" height="30" fill="#a37731"/>
    <text x="106" y="524">What did the society spend on tankers last summer?</text>

    <rect x="80" y="542" width="4" height="30" fill="#a37731"/>
    <text x="106" y="564">Is there a borewell, and what is its yield in April?</text>

    <rect x="80" y="582" width="4" height="30" fill="#a37731"/>
    <text x="106" y="604">What is the underground and overhead tank capacity, in days?</text>

    <rect x="80" y="622" width="4" height="30" fill="#a37731"/>
    <text x="106" y="644">Is the connection sanctioned by PMC, or still on a builder arrangement?</text>
  </g>

  <text x="80" y="670" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#73695d">Reported conditions vary pocket to pocket across Bavdhan. Verify for the specific plot.</text>
</svg>
