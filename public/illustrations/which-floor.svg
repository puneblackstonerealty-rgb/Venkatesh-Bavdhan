<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Trade-offs between low, middle and high floors in a tall residential tower">
  <rect width="1200" height="675" fill="#fef4e9"/>
  <rect x="0" y="0" width="1200" height="6" fill="#405828"/>

  <text x="80" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#2b2a29">Which floor, and what it costs you</text>
  <text x="80" y="130" font-family="Helvetica Neue, Arial, sans-serif" font-size="19" fill="#4a4640">Floor rise is charged upwards. Most of the practical advantages are not linear with it.</text>

  <!-- Tower -->
  <rect x="80" y="180" width="150" height="440" rx="8" fill="#ebdcc5"/>
  <rect x="80" y="180" width="150" height="146" rx="8" fill="#405828"/>
  <rect x="80" y="326" width="150" height="147" fill="#405828" opacity="0.6"/>
  <rect x="80" y="473" width="150" height="147" fill="#405828" opacity="0.3"/>
  <g font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#fffaf4" text-anchor="middle">
    <text x="155" y="260">19 to 27</text>
    <text x="155" y="406">9 to 18</text>
  </g>
  <text x="155" y="553" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#4a4640" text-anchor="middle">1 to 8</text>

  <!-- Rows -->
  <g font-family="Helvetica Neue, Arial, sans-serif">
    <text x="270" y="216" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#2b2a29">High</text>
    <text x="270" y="250" font-size="17" fill="#4a4640">Best view and light, least street noise, most privacy.</text>
    <text x="270" y="276" font-size="17" fill="#4a4640">Highest floor rise, most lift dependence, most wind,</text>
    <text x="270" y="302" font-size="17" fill="#4a4640">and the slowest evacuation on foot.</text>

    <line x1="270" y1="326" x2="1120" y2="326" stroke="#ebdcc5"/>

    <text x="270" y="366" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#2b2a29">Middle</text>
    <text x="270" y="400" font-size="17" fill="#4a4640">Above the treeline and the road noise, below the wind.</text>
    <text x="270" y="426" font-size="17" fill="#4a4640">Moderate floor rise. Usually the easiest to resell,</text>
    <text x="270" y="452" font-size="17" fill="#4a4640">because it suits the widest range of buyers.</text>

    <line x1="270" y1="473" x2="1120" y2="473" stroke="#ebdcc5"/>

    <text x="270" y="513" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#2b2a29">Low</text>
    <text x="270" y="547" font-size="17" fill="#4a4640">Cheapest, quickest to leave, least dependent on lifts</text>
    <text x="270" y="573" font-size="17" fill="#4a4640">and pumps. Faces the podium rather than the horizon,</text>
    <text x="270" y="599" font-size="17" fill="#4a4640">and carries more noise from the deck and the gate.</text>
  </g>

  <text x="80" y="656" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#405828">Ask for the whole floor-rise table, not the rate for the floor you were shown</text>
</svg>
